<g font-family="DejaVu Sans, sans-serif" fill="#b6c2cf">
 <text x="94" y="733" font-size="15" font-weight="600" fill="#f2f4f8">How to read this comparison</text>
 <text x="94" y="762" font-size="14">CLI: 7-run command-to-response medians · API: 5-run direct request medians · API + caching: 21-run time to first usable cached frame.</text>
 <text x="94" y="789" font-size="14">Cache-first timing excludes server-sync completion; its background refresh used a fake CLI. The timings measure different stages.</text>
 <text x="94" y="835" font-size="13">Lower is faster · API and CLI p95 values were not available for this comparison.</text>
</g>
</svg>