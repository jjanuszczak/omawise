<g font-family="DejaVu Sans, sans-serif" fill="#f2f4f8">
 <text x="92" y="88" font-size="34" font-weight="700">Reader latency: CLI vs API vs cache-first</text>
 <text x="94" y="127" font-size="17" fill="#b6c2cf">Median time for core Reader actions · milliseconds on a logarithmic scale</text>
</g>
<g font-family="DejaVu Sans, sans-serif" font-size="16" fill="#f2f4f8">
 <circle cx="105" cy="171" r="8" fill="#f4a261"/><text x="123" y="177">Readwise CLI</text>
 <circle cx="301" cy="171" r="8" fill="#54b7d3"/><text x="319" y="177">Direct API</text>
 <circle cx="463" cy="171" r="8" fill="#7bd88f"/><text x="481" y="177">API + caching</text>
</g>
<g font-family="DejaVu Sans, sans-serif" font-size="15" fill="#b6c2cf" stroke="#34434f" stroke-width="1">
 <line x1="300" y1="222" x2="300" y2="626"/><line x1="558" y1="222" x2="558" y2="626"/><line x1="816" y1="222" x2="816" y2="626"/><line x1="940" y1="222" x2="940" y2="626"/>
 <line x1="300" y1="626" x2="940" y2="626" stroke="#52616b"/>
 <text x="300" y="652" text-anchor="middle" stroke="none">10 ms</text><text x="558" y="652" text-anchor="middle" stroke="none">100 ms</text><text x="816" y="652" text-anchor="middle" stroke="none">1 s</text><text x="940" y="652" text-anchor="middle" stroke="none">3 s</text>
</g>
<g font-family="DejaVu Sans, sans-serif" fill="#f2f4f8">
 <text x="94" y="252" font-size="22" font-weight="700">Inbox list</text><text x="94" y="278" font-size="15" fill="#b6c2cf">50 documents</text>
 <text x="94" y="421" font-size="22" font-weight="700">Article detail</text><text x="94" y="447" font-size="15" fill="#b6c2cf">Open selected article</text>
</g>
