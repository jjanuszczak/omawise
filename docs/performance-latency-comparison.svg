<g font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#f2f4f8">
 <text x="920" y="326">2,238.5 ms</text><text x="796" y="371">748 ms</text><text x="652" y="416">71 ms</text>
 <text x="905" y="495">1,924.6 ms</text><text x="740" y="540">446 ms</text><text x="359" y="585">15 ms</text>
</g>
